services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: darknet_backend
    restart: always
    expose:
      - "8000"
    environment:
      # Connect to the Ubuntu server's local MongoDB (already has your 560k messages!)
      # host.docker.internal resolves to the Ubuntu host machine from inside Docker
      - MONGODB_URL=mongodb://host.docker.internal:27017
    env_file:
      - ./backend/.env
    volumes:
      # Persist Telegram session and scraped data across container restarts
      - ./data:/app/data
    extra_hosts:
      # This allows Docker containers to reach the host machine's localhost
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: darknet_frontend
    restart: always
    ports:
      # Port 3000 works on both Windows and Ubuntu without any conflicts
      - "3000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
