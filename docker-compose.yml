services:
  mongodb:
    image: mongo:6.0
    container_name: darknet_mongo
    restart: always
    # MongoDB is internal only - no need to expose port to host
    expose:
      - "27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: darknet_backend
    restart: always
    expose:
      - "8000"
    environment:
      # Override MongoDB URL to use the internal Docker service name
      - MONGODB_URL=mongodb://mongodb:27017
    env_file:
      - ./backend/.env
    volumes:
      # Persist Telegram session and scraped data across container restarts
      - ./data:/app/data
    depends_on:
      mongodb:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: darknet_frontend
    restart: always
    ports:
      # Port 3000 works on both Windows and Ubuntu without any conflicts
      - "3000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend

volumes:
  mongo_data:

