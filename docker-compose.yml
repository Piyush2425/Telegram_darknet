services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: darknet-monitor-backend
    restart: unless-stopped
    volumes:
      # Map the stateful telemetry CSVs, PDF reports, and Telegram session file to the host
      - ./data:/app/data
    env_file:
      - ./backend/.env
    environment:
      # If running Ollama on the host Ubuntu machine, use host.docker.internal
      # to connect to the host's port 11434 cleanly.
      - LOCAL_LLM_URL=http://host.docker.internal:11434/api/generate
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: darknet-monitor-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
